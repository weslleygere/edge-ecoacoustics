
[agent]
  flush_interval = "2s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["eco/+/indices"]
  qos = 1
  client_id = "eco-telegraf"
  persistent_session = true
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "eco_indices"
    timestamp_path = "ts_ms"
    timestamp_format = "unix_ms"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bio"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "geo"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "antro"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rms"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "inference_ms"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "errors"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "overflows"
      type = "int"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "eco"
  bucket = "ecoacoustics"
